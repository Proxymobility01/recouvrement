services:

  db:
    image: timescale/timescaledb-ha:pg15
    restart: always
    container_name: rc_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - type: volume
        source: recouvrement_data
        target: /home/postgres/pgdata/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    restart: always
    container_name: rc_redis
    ports:
      - "6380:6379"
    networks:
      - recouvrement_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: recouvrement_api:latest
    restart: always
    container_name: rc_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/home/django
    networks:
      - recouvrement_network
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=True
      - COLLECT_STATIC=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  recouvrement_data:
    name: recouvrement_data

networks:
  recouvrement_network:
    name: recouvrement_network
    driver: bridge