services:

  db:
    image: timescale/timescaledb-ha:pg15
    restart: always
    container_name: rc_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - type: volume
        source: recouvrement_data
        target: /home/postgres/pgdata/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    restart: always
    container_name: rc_redis
    ports:
      - "6380:6379"
    networks:
      - recouvrement_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: always
    container_name: rc_pgbouncer
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}


      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction

      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=45
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=15
      - RESERVE_POOL_TIMEOUT=3

      - MAX_DB_CONNECTIONS=60
      - MAX_USER_CONNECTIONS=60

      - SERVER_CONNECT_TIMEOUT=15
      - SERVER_LOGIN_RETRY=1
      - SERVER_IDLE_TIMEOUT=600
      - QUERY_WAIT_TIMEOUT=30
      - CLIENT_LOGIN_TIMEOUT=90

      - ADMIN_USERS=${DB_USER}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:5432"
    networks:
      - recouvrement_network
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: recouvrement_api:latest
    restart: always
    container_name: rc_backend
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /home/django
    volumes:
      - ./:/home/django
    networks:
      - recouvrement_network
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=False
      - COLLECT_STATIC=False
      - INIT_SYSTEM=False
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  recouvrement_data:
    name: recouvrement_data

networks:
  recouvrement_network:
    name: recouvrement_network
    driver: bridge