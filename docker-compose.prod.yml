services:
  db:
    image: timescale/timescaledb-ha:pg15
    restart: always
    container_name: rc_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "127.0.0.1:5454:5432"
    volumes:
      - recouvrement_db_data:/home/postgres/pgdata/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: always
    container_name: rc_pgbouncer
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction


      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=45
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=15
      - RESERVE_POOL_TIMEOUT=3
      - MAX_DB_CONNECTIONS=60
      - MAX_USER_CONNECTIONS=60


      - SERVER_CONNECT_TIMEOUT=15
      - SERVER_LOGIN_RETRY=1
      - SERVER_IDLE_TIMEOUT=600
      - QUERY_WAIT_TIMEOUT=30
      - CLIENT_LOGIN_TIMEOUT=90

      - ADMIN_USERS=${DB_USER}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options
    ports:
      - "127.0.0.1:6432:5432"
    networks:
      - recouvrement_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: always
    container_name: rc_redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --aof-load-corrupt-tail-max-size 64mb
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - recouvrement_redis_data:/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  q2:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: recouvrement_api:latest
    restart: always
    container_name: rc_q2
    command: python manage.py qcluster
    networks:
      - recouvrement_network
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: recouvrement_api:latest
    restart: always
    container_name: rc_backend
    command: gunicorn config.asgi:application -c gunicorn.conf.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:9100:8000"
    volumes:
      - /home/ubuntu/recouvrement/config/staticfiles/:/home/django/config/staticfiles
    networks:
      - recouvrement_network
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy


volumes:
  recouvrement_db_data:
    external: true
  recouvrement_redis_data:
    external: true


networks:
  recouvrement_network:
    name: recouvrement_network
    driver: bridge