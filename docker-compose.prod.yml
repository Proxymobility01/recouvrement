services:
  db:
    image: timescale/timescaledb-ha:pg15
    restart: always
    container_name: rc_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "127.0.0.1:5454:5432"
    volumes:
      - recouvrement_db_data:/home/postgres/pgdata/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    container_name: rc_redis
    command: >
      redis-server
      --appendonly yes
      --aof-load-corrupt-tail yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - recouvrement_redis_data:/data
    networks:
      - recouvrement_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  q2:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: recouvrement_api:latest
    restart: always
    container_name: rc_q2
    command: python manage.py qcluster
    networks:
      - recouvrement_network
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: recouvrement_api:latest
    restart: always
    container_name: rc_backend
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:9100:8000"
    volumes:
      - /home/ubuntu/recouvrement/config/staticfiles/:/home/django/config/staticfiles
    networks:
      - recouvrement_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


volumes:
  recouvrement_db_data:
    external: true
  recouvrement_redis_data:
    external: true


networks:
  recouvrement_network:
    name: recouvrement_network
    driver: bridge